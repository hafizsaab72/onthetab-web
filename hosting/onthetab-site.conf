# OnTheTab site on xeca-ai.tech; included from the site's HTTPS server block.
# Pretty URLs for the pages Google OAuth branding, App Store and Play link to.
location = /onthetab { return 301 /onthetab/; }

location = /onthetab/privacy {
    alias /var/www/onthetab-site/privacy.html;
    default_type text/html;
    charset utf-8;
}

location = /onthetab/terms {
    alias /var/www/onthetab-site/terms.html;
    default_type text/html;
    charset utf-8;
}

location = /onthetab/support {
    alias /var/www/onthetab-site/support.html;
    default_type text/html;
    charset utf-8;
}

# Read-only group page: /onthetab/g?t=<token>. The token is the key, so the
# page is never cached or indexed and sends no Referer.
location = /onthetab/g {
    alias /var/www/onthetab-site/g.html;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# Home page, the .html pages, styles, script and images.
location ^~ /onthetab/ {
    alias /var/www/onthetab-site/;
    index index.html;
    charset utf-8;
}
